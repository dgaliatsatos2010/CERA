[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cera-clustering-research"
version = "0.1.0"
description = "CERA: holdout-checked projection screening for exploratory clustering"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Dimitrios Galiatsatos"}]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.8",
]
keywords = ["clustering", "machine-learning", "minority-clusters", "unsupervised-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
